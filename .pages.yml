media:
  input: images/uploads
  output: /images/uploads

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: blog
    filename: "{primary}.md"

    view:
      fields:
        - title
        - date
        - category

    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: category
        label: Category
        type: string
        options:
          - Bedtime Story
          - Wonder Talk
          - Toddler Activity
          - Motherhood Reflection
          - Ancient Indian Wisdom

      - name: description
        label: Short Description
        type: text

      - name: cover
        label: Cover Image
        type: image

      - name: body
        label: Story Content
        type: rich-text
