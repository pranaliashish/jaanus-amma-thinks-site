media:
  input: images/uploads
  output: /images/uploads

content:

  - name: blog
    label: Blog Posts
    type: collection

    path: blog

    filename: "{primary}.md"

    view:
      fields: [title, date, category]

    fields:

      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: category
        label: Category
        type: select

       options:
  - label: Bedtime Story
    value: Bedtime Story

  - label: Wonder Talk
    value: Wonder Talk

  - label: Toddler Activity
    value: Toddler Activity

  - label: Motherhood Reflection
    value: Motherhood Reflection

  - label: Ancient Indian Wisdom
    value: Ancient Indian Wisdom
      - name: description
        label: Short Description
        type: text

      - name: cover
        label: Cover Image
        type: image

      - name: body
        label: Story Content
        type: rich-text
