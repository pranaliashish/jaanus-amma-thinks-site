media:
  input: images/uploads
  output: /images/uploads

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: blog
    filename: "{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: description
        label: Description
        type: text

      - name: body
        label: Body
        type: rich-text