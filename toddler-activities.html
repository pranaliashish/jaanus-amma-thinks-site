<script>

const stories = [

     {
    title: "5 Screen-Free Nature Activities for Curious Toddlers 🌿",

    category: "Toddler Activities",

    description:
        "Five simple nature activities that encourage curiosity, creativity, and screen-free play for toddlers. 🌿✨",
    image: "nature-activities.png",

    slug: "5-screen-free-nature-activities-for-curious-toddlers"
},


    {
    title: "Cotton Ball Rain: A Gentle Screen-Free Activity for Curious Toddlers",

    category: "Toddler Activities",

    description:
        "Looking for an easy screen-free toddler activity? Try Cotton Ball Rain—a simple play idea that builds fine motor skills, focus, coordination, and imagination using just cotton balls and a bowl",
    image: "activities-2.png",

    slug: "cotton-ball-rain-a-gentle-screen-free-activity-for-curious-toddlers"
},

     {
    title: "Leaf Soup: A Simple Screen-Free Nature Activity for Toddlers",

    category: "Toddler Activities",

    description:
        "Try Leaf Soup, a fun and easy screen-free toddler activity using leaves, flowers, and nature treasures. Encourages sensory play, imagination, creativity, and outdoor exploration.",

},

     {
    title: "The Sock Matching Basket: A Simple Indoor Activity for Toddlers",

    category: "Toddler Activities",

    description:

},

    image: "window-activity.png",

    slug: "window-nature-gallery-a-simple-indoor-nature-activity-for-toddlers"
}
];

const storyGrid = document.getElementById("story-grid");

stories
.filter(story => story.category === "Toddler Activities")
.forEach(story => {

    storyGrid.innerHTML += `

        <a href="blog/story.html?id=${story.slug}" class="story-card">

                <img src="${story.image}" alt="${story.title}">

            <div class="story-content">

                <span class="story-category">
                    ${story.category}
                </span>

                <h3>${story.title}</h3>

                <p>${story.description}</p>

            </div>

        </a>

    `;

});
