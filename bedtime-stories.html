<section id="blog" class="featured-section">

    <div class="section-header">
        <h2>Bedtime Stories</h2>
        <p>Gentle bedtime tales for little hearts 🌙</p>
    </div>

   <div class="story-grid" id="story-grid">
            </div>

<script>

const stories = [

    {
        title: "The Little Firefly Who Wanted To Shine All Night",

        category: "Bedtime Story",

        description:
            "A gentle bedtime story about rest, balance, and learning that even tiny lights need moments of pause to shine brightly.",

        image: "firefly-story.png",

        slug: "the-little-firefly-who-wanted-to-shine-all-night"
    },

    {
    title: "The Tiny Spoon Who Wanted To Be A Sword",

    category: "Bedtime Story",

    description:
        "A gentle bedtime story about discovering that true strength does not come from being powerful like others — but from embracing the quiet kindness we were made to give.",

    image: "tiny-spoon-story.png",

    slug: "the-tiny-spoon-who-wanted-to-be-a-sword"
},

    {
    title: "The Little Cloud Who Held Everything Inside",

    category: "Bedtime Story",

    description:
        "A gentle bedtime story about a little cloud who learns that sharing feelings can make the heart feel lighter. Perfect for helping children understand emotions, tears, and healthy emotional expression.",
    image: "cloud-feelings-story.png",

    slug: "the-little-cloud-who-held-everything-inside"
},

     {
    title: "The Little Leaf Who Was Afraid To Fall",

    category: "Bedtime Story",

    description:
        "A gentle bedtime story about change, courage, and learning to trust new beginnings. 🍂",
    image: "leaf-story.png",

    slug: "the-little-leaf-who-was-afraid-to-fall"
},

     {
    title: "The Little Clock Who Wanted Time to Stop",

    category: "Bedtime Story",

    description:
        "A gentle bedtime story about love, loss, healing, and the memories that stay with us. 🌙",
    image: "clock-story.png",

    slug: "the-little-clock-who-wanted-time-to-stop"
},

     {
    title: "The Little Moon Who Was Afraid to Change 🌙",

    category: "Bedtime Story",

    description:
        "A comforting bedtime story about a little moon who learns that changing doesn't make her less lovable. A gentle tale that helps children embrace growth, change, and self-worth.",
    image: "moon-story.png",

    slug: "the-little-moon-who-was-afraid-to-change-or-a-gentle-bedtime-story-about-growth-and-self-worth"
},

     {
    title: "The Boy Who Borrowed Tomorrow 🌙",

    category: "Bedtime Story",

    description:
        "Help children navigate worries about the future with this heartwarming bedtime story about Avi, a magical Tomorrow Keeper, and the lesson of living one day at a time.",

    slug: "the-boy-who-borrowed-tomorrow-or-a-bedtime-story-about-worry-and-living-in-the-present"
},

    {
    title: "The Little Pocket That Held Rain 🌧️",

    category: "Bedtime Story",

    description:
        "Help children explore empathy and emotional awareness through this touching bedtime story about Mira, a mysterious pocket, and the feelings we sometimes carry inside.",
    image: "rain-story.png",

    slug: "the-little-pocket-that-held-rain-or-a-bedtime-story-about-feelings-and-empathy"
},

    {
    title: "The Little Raincloud Who Was Afraid to Cry 🌧️",

    category: "Bedtime Story",

    description:
        "Help children understand that it's okay to cry with this heartwarming bedtime story about a little raincloud who discovers that tears can nourish growth, healing, and hope.",
    image: "raincloud-story.png",

    slug: "the-little-raincloud-who-was-afraid-to-cry-or-a-gentle-bedtime-story-about-feelings-and-tears"
} 
];

const storyGrid = document.getElementById("story-grid");

stories
.filter(story => story.category === "Bedtime Story")
.forEach(story => {

    storyGrid.innerHTML += `

        <a href="blog/story.html?id=${story.slug}" class="story-card">

                <img src="${story.image}" alt="${story.title}">

            <div class="story-content">

                <span class="story-category">
                    ${story.category}
                </span>

                <h3>${story.title}</h3>

                <p>${story.description}</p>

            </div>

        </a>

    `;

});

</script>
