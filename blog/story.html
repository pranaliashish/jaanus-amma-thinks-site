<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Story</title>
<meta name="description" content="">
    
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <div class="nav-logo">
                🌙 <span>Jaanu’s Amma Thinks</span>
            </div>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
            </ul>

        </div>

    </nav>

    <section class="story-page">

        <div class="story-container">

            <span class="story-tag" id="story-category">
                Bedtime Story
            </span>

            <h1 class="story-title" id="story-title">
                Loading Story...
            </h1>

            <p class="story-intro" id="story-description">
                Please wait...
            </p>

            <div class="story-hero-image">

                <img id="story-image"
                     src=""
                     alt="Story Image">

            </div>

            <div class="story-body" id="story-content">

            </div>

            <div class="little-reflection" id="story-reflection">

            </div>

        </div>

    </section>

<script>

const params = new URLSearchParams(window.location.search);

const storyId = params.get("id");

    function generateRelatedPosts(category, storyId) {

    const headings = {

        "Wonder Talks": "✨ Continue Wondering",

        "Bedtime Story": "🌙 More Bedtime Stories",

        "Ancient Indian Wisdom": "🌿 Continue Exploring",

        "Motherhood Reflections": "🤍 More Reflections",

        "Toddler Activities": "🌱 More Toddler Activities"

    };

    const relatedPosts = allPosts
        .filter(post =>
            post.category === category &&
            post.slug !== storyId
        )
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    if (relatedPosts.length === 0) return "";

    return `

    <div class="related-posts">

        <h3>${headings[category] || "✨ Continue Reading"}</h3>

        <ul>

            ${relatedPosts.map(post => `

                <li>
                    <a href="/blog/story.html?id=${post.slug}">
                        ${post.title}
                    </a>
                </li>

            `).join("")}

        </ul>

    </div>

    `;
}

async function loadStory() {

    const response = await fetch(`/blog/${storyId}.md`);

    const markdown = await response.text();

    const frontmatterMatch = markdown.match(/---([\s\S]*?)---/);

    const content = markdown.replace(/---([\s\S]*?)---/, "").trim();

    const frontmatter = frontmatterMatch[1];

    function getField(field) {

       const regex = new RegExp(`${field}:\\s*([\\s\\S]*?)(\\n\\w+:|$)`);
        const match = frontmatter.match(regex);

      return match ? match[1].replace(/\n\w+:$/, "").trim() : ""; 

    }

    const title = getField("title");

    const category = getField("category");

    const description = getField("description");

    const cover = getField("cover");

   document.title = title;

let metaDescription = document.querySelector(
    'meta[name="description"]'
);

metaDescription.content = description;

function setMetaProperty(property, content) {

    let tag = document.querySelector(
        `meta[property="${property}"]`
    );

    if (!tag) {
        tag = document.createElement("meta");
        tag.setAttribute("property", property);
        document.head.appendChild(tag);
    }

    tag.content = content;
}

setMetaProperty("og:title", title);
setMetaProperty("og:description", description);
setMetaProperty(
    "og:image",
    window.location.origin + cover
);
setMetaProperty("og:type", "article");

    document.getElementById("story-title").innerHTML = title;

    document.getElementById("story-category").innerHTML = category;

    document.getElementById("story-description").innerHTML = description;

   document.getElementById("story-image").src = cover;
document.getElementById("story-image").alt = title;

  document.getElementById("story-content").innerHTML =
    marked.parse(content);

document.getElementById("story-content").innerHTML +=
generateRelatedPosts(category, storyId) +
`
<div class="reflection-ending">
    Thank you for spending a quiet moment at Jaanu's Amma Thinks ✨
</div>
`;
}

loadStory();

</script>

    <script src="/posts.js"></script>
    
</body>

</html>
