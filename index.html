<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaanu’s Amma Thinks - Magical Stories & Motherhood</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-moon"></i>
                <span>Jaanu's Amma Thinks</span>
            </div>

            <ul class="nav-menu">
                <li class="nav-item"><a href="#home" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#blog" class="nav-link">Blog</a></li>
                <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#shop" class="nav-link">Shop</a></li>
                <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero -->
    <section id="home" class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">Jaanu's Amma Thinks</h1>

                <p class="hero-subtitle">
                    Whispers of motherhood, magical bedtime stories,
                    and little moments that sparkle ✨
                </p>

                <div class="hero-buttons">
                    <a href="#blog" class="btn btn-primary">Explore Stories</a>
                    <a href="#shop" class="btn btn-secondary">Visit Shop</a>
                </div>
            </div>
        </div>
    </section>

<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
    
</body>
</html>
